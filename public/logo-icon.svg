<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="am-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#477BFF" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>
    <linearGradient id="am-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#477BFF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Hexagonal / Rounded Shield -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0D111D" stroke="url(#am-grad)" stroke-width="2.5" />
  
  <!-- Glowing subtle core -->
  <circle cx="50" cy="50" r="30" fill="url(#am-glow)" opacity="0.25" filter="url(#glow-blur)" />
  
  <!-- Stylized Geometric 'A' and 'M' Neural Mesh -->
  <!-- 'A' Structure -->
  <path d="M28 68 L42 28 L56 68" stroke="url(#am-grad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M34 54 L50 54" stroke="url(#am-grad)" stroke-width="4.5" stroke-linecap="round" />
  
  <!-- 'M' Accent merged into dynamic wave -->
  <path d="M52 68 L60 38 L68 54 L76 38 L84 68" stroke="#FFFFFF" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />
  
  <!-- Quantum Core Pulse Dot -->
  <circle cx="68" cy="54" r="3.5" fill="#00F0FF" />
</svg>
